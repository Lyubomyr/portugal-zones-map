<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Португалія — школи · садки · зони</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
 html,body{margin:0;height:100%;font-family:system-ui,Arial,sans-serif}
 #map{position:absolute;inset:0}
 .panel{position:absolute;top:10px;left:10px;z-index:2;background:#fff;border-radius:8px;
   box-shadow:0 1px 6px rgba(0,0,0,.3);padding:10px 12px;font-size:13px;max-width:235px}
 .panel h1{font-size:14px;margin:0 0 6px}
 .panel label{display:block;margin:3px 0;cursor:pointer;line-height:1.5}
 .sw{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-2px;border:2px solid #fff;box-shadow:0 0 0 1px #999}
 .row{margin:2px 0 8px} .row select{width:100%;padding:3px;font-size:13px}
 .hd{font-weight:600;margin:8px 0 2px;font-size:12px;color:#555}
 .note{color:#666;font-size:11px;margin-top:8px;border-top:1px solid #eee;padding-top:6px}
 .maplibregl-popup-content{font:13px system-ui;max-width:250px}
 .pt{font-weight:600;display:block;margin-bottom:2px}
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
 <h1>🇵🇹 Школи · садки · зони</h1>
 <div class="hd">Тип карти</div>
 <div class="row">
   <select id="basemap">
     <option value="liberty">Вулиці (як Google)</option>
     <option value="bright">Світла</option>
     <option value="satellite">Супутник</option>
     <option value="positron">Мінімал (сіра)</option>
   </select>
 </div>
 <div class="hd">Шари</div>
 <label><input type="checkbox" id="t-zones" checked><span class="sw" style="background:#2e9c3e"></span>Зони (🟢🟡🔴)</label>
 <label><input type="checkbox" id="t-pub" checked><span class="sw" style="background:#1f6fd6"></span>Держшколи</label>
 <label><input type="checkbox" id="t-priv" checked><span class="sw" style="background:#e8890c"></span>Приватні школи</label>
 <label><input type="checkbox" id="t-intl" checked><span class="sw" style="background:#8b3ffb"></span>Міжнародні школи</label>
 <label><input type="checkbox" id="t-creches" checked><span class="sw" style="background:#12a19a"></span>Ясла/садки</label>
 <label><input type="checkbox" id="t-social" checked><span class="sw" style="background:#d23b3b"></span>Соцжитло (Cascais GIS)</label>
 <div class="note">v1 — кільце Parede + соцжитло Cascais. Далі: усі школи PT, садки, Leiria. Клік по точці = деталі.</div>
</div>
<script>
const RATING = {green:'#2e9c3e', yellow:'#e0b400', red:'#d23b3b'};
const STYLES = {
  liberty: 'https://tiles.openfreemap.org/styles/liberty',
  bright:  'https://tiles.openfreemap.org/styles/bright',
  positron:'https://tiles.openfreemap.org/styles/positron',
  satellite: {version:8, sources:{esri:{type:'raster',
      tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
      tileSize:256, attribution:'Imagery © Esri'}},
    layers:[{id:'esri', type:'raster', source:'esri'}]}
};
const vis = {zones:true, pub:true, priv:true, intl:true, creches:true, social:true};
let DATA = null;

const map = new maplibregl.Map({
  container:'map', style:STYLES.liberty,
  center:[-9.33, 38.71], zoom:11.5
});
map.addControl(new maplibregl.NavigationControl(), 'top-right');
map.addControl(new maplibregl.ScaleControl(), 'bottom-left');

async function gj(u){ const r = await fetch(u); return r.json(); }

function addData(){
  if(!DATA || map.getSource('schools')) return;
  map.addSource('schools',{type:'geojson',data:DATA.schools});
  map.addSource('creches',{type:'geojson',data:DATA.creches});
  map.addSource('zones',  {type:'geojson',data:DATA.zones});
  map.addSource('social', {type:'geojson',data:DATA.social});
  const V = id => (vis[id] ? 'visible':'none');
  map.addLayer({id:'social',source:'social',type:'circle',layout:{visibility:V('social')},paint:{
    'circle-radius':['interpolate',['linear'],['coalesce',['get','fogos'],0],0,3,50,7,200,13],
    'circle-color':'#d23b3b','circle-opacity':0.5,'circle-stroke-color':'#fff','circle-stroke-width':0.5}});
  map.addLayer({id:'zones',source:'zones',type:'circle',layout:{visibility:V('zones')},paint:{
    'circle-radius':17,
    'circle-color':['match',['get','rating'],'green',RATING.green,'yellow',RATING.yellow,'red',RATING.red,'#888'],
    'circle-opacity':0.35,'circle-stroke-width':2,
    'circle-stroke-color':['match',['get','rating'],'green',RATING.green,'yellow',RATING.yellow,'red',RATING.red,'#888']}});
  const sl=(id,cat,color)=>map.addLayer({id,source:'schools',type:'circle',filter:['==',['get','cat'],cat],
    layout:{visibility:V(id)},paint:{'circle-radius':6,'circle-color':color,'circle-stroke-color':'#fff','circle-stroke-width':2}});
  sl('pub','pub','#1f6fd6'); sl('priv','priv','#e8890c'); sl('intl','intl','#8b3ffb');
  map.addLayer({id:'creches',source:'creches',type:'circle',layout:{visibility:V('creches')},
    paint:{'circle-radius':6,'circle-color':'#12a19a','circle-stroke-color':'#fff','circle-stroke-width':2}});
}

map.on('style.load', addData);

const esc = s => (s||'').toString().replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function bindOnce(){
  const popup=(html,ll)=>new maplibregl.Popup({maxWidth:'250px'}).setLngLat(ll).setHTML(html).addTo(map);
  const onClick=(layer,fn)=>{
    map.on('click',layer,e=>popup(fn(e.features[0].properties),e.lngLat));
    map.on('mouseenter',layer,()=>map.getCanvas().style.cursor='pointer');
    map.on('mouseleave',layer,()=>map.getCanvas().style.cursor='');
  };
  ['pub','priv','intl'].forEach(l=>onClick(l,p=>`<span class="pt">${esc(p.name)}</span>${esc(p.info)}`));
  onClick('creches',p=>`<span class="pt">${esc(p.name)}</span>${esc(p.info)}`);
  onClick('zones',  p=>`<span class="pt">Зона: ${esc(p.name)}</span>${esc(p.info)}`);
  onClick('social', p=>`<span class="pt">Соцжитло: ${esc(p.local)||'—'}</span>${esc(p.freg)} · ${p.fogos||0} fogos (${p.bldg||0} буд.)`);
  const bind=(el,layer)=>{const c=document.getElementById(el);c.addEventListener('change',()=>{
    vis[layer]=c.checked; if(map.getLayer(layer)) map.setLayoutProperty(layer,'visibility',c.checked?'visible':'none');});};
  bind('t-zones','zones'); bind('t-pub','pub'); bind('t-priv','priv');
  bind('t-intl','intl'); bind('t-creches','creches'); bind('t-social','social');
  document.getElementById('basemap').addEventListener('change',e=>{ map.setStyle(STYLES[e.target.value]); });
}

(async ()=>{
  const [schools,creches,zones,social]=await Promise.all([
    gj('./data/schools.geojson'),gj('./data/creches.geojson'),
    gj('./data/zones.geojson'),gj('./data/social_cascais.geojson')]);
  DATA={schools,creches,zones,social};
  if(map.isStyleLoaded()) addData();
  bindOnce();
})();
</script>
</body>
</html>
